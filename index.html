<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gala USM 2027</title>
<meta name="description" content="Gala USM 2027. Una noche de etiqueta frente al Pacífico, en la Casa Central de Valparaíso.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Geist:wght@300;400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --negro: #000000;
    --linea: #1F1F1F;
    --blanco: #EDEDED;
    --gris: #8F8F8F;
    --gris-osc: #5C5C5C;
    --oro: #C9A45C;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }

  body {
    background:
      radial-gradient(ellipse 70% 55% at 50% 30%, rgba(201,164,92,0.10), transparent 70%),
      radial-gradient(ellipse 90% 60% at 50% 110%, rgba(120,130,160,0.08), transparent 70%),
      var(--negro);
    min-height: 100vh;
    color: var(--blanco);
    font-family: "Geist", system-ui, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- Barra superior ---------- */
  .barra {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    height: 72px;
    padding: 0 40px;
    border-bottom: 1px solid var(--linea);
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 0.8125rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gris);
  }
  .barra .marca {
    font-family: "Bodoni Moda", Didot, serif;
    text-transform: none;
    letter-spacing: 0;
    font-size: 1.25rem;
    color: var(--blanco);
  }
  .barra .der { text-align: right; }

  /* ---------- Contenedor con líneas finas ---------- */
  main {
    padding: 56px 40px 64px;
  }

  .caja {
    max-width: 1120px;
    margin: 0 auto;
    border: 1px solid var(--linea);
  }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    text-align: center;
    padding: 72px 24px 64px;
    overflow: hidden;
    isolation: isolate;
  }

  /* Emblema: escudo con brillo, al estilo de los logos de Apple Events */
  .emblema {
    position: relative;
    width: 240px;
    height: 240px;
    margin: 0 auto;
  }
  .emblema::before {
    content: "";
    position: absolute;
    inset: -140px;
    z-index: -1;
    background: radial-gradient(circle, rgba(240,221,168,0.20), rgba(201,164,92,0.08) 40%, transparent 68%);
    opacity: 0;
    animation: aparecer 2.4s ease 0.8s forwards;
  }
  .emblema .logo {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 100%;
    height: auto;
    transform: translate(-50%, -50%);
    opacity: 0;
    animation: aparecer 1.4s ease 0.3s forwards;
  }

  .institucion {
    margin-top: 48px;
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gris);
  }

  h1 {
    margin-top: 20px;
    font-family: "Bodoni Moda", Didot, serif;
    font-weight: 400;
    font-size: clamp(3.75rem, 11vw, 8.5rem);
    line-height: 0.95;
    letter-spacing: -0.025em;
    color: #FFFFFF;
  }

  .bajada {
    margin: 24px auto 0;
    max-width: 36ch;
    font-size: clamp(1.0625rem, 1.8vw, 1.25rem);
    font-weight: 300;
    line-height: 1.5;
    color: var(--gris);
  }

  .hero > *:not(.emblema) {
    opacity: 0;
    animation: aparecer 1s ease forwards;
  }
  .hero .institucion { animation-delay: 1.2s; }
  .hero h1 { animation-delay: 1.35s; }
  .hero .bajada { animation-delay: 1.5s; }

  /* ---------- Datos ---------- */
  .datos {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--linea);
  }
  .dato {
    padding: 24px 28px;
    text-align: left;
  }
  .dato + .dato { border-left: 1px solid var(--linea); }
  .dato dt {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gris-osc);
  }
  .dato dd {
    margin-top: 10px;
    font-size: 1.0625rem;
    line-height: 1.4;
    color: var(--blanco);
  }

  /* ---------- Acción ---------- */
  .accion {
    border-top: 1px solid var(--linea);
    padding: 48px 24px 28px;
    text-align: center;
  }

  .boton {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 248px;
    height: 52px;
    padding: 0 36px;
    border: 1px solid #FFFFFF;
    border-radius: 999px;
    background: #FFFFFF;
    color: #000000;
    font-family: "Geist", system-ui, sans-serif;
    font-size: 0.9375rem;
    font-weight: 500;
    cursor: pointer;
    transition: box-shadow .3s ease, border-color .3s ease;
  }
  .boton:hover {
    border-color: var(--oro);
    box-shadow: 0 0 0 4px rgba(201,164,92,0.18), 0 0 40px -6px rgba(201,164,92,0.45);
  }
  .boton:focus-visible {
    outline: 2px solid var(--oro);
    outline-offset: 4px;
  }

  .nota {
    margin-top: 16px;
    min-height: 1.4em;
    font-size: 0.8125rem;
    color: var(--gris-osc);
  }
  .nota.activa { color: var(--blanco); }

  footer {
    padding: 0 40px 40px;
    text-align: center;
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gris-osc);
  }

  @keyframes aparecer { to { opacity: 1; } }

  /* ---------- Móvil ---------- */
  @media (max-width: 720px) {
    .barra { padding: 0 16px; height: 60px; font-size: 0.6875rem; }
    .barra .izq { display: none; }
    .barra { grid-template-columns: 1fr auto; }
    main { padding: 24px 16px 40px; }
    .hero { padding: 56px 16px 48px; }
    .emblema { width: 200px; height: 200px; }
    .institucion { margin-top: 40px; font-size: 0.6875rem; }
    .datos { grid-template-columns: 1fr; }
    .dato + .dato { border-left: 0; border-top: 1px solid var(--linea); }
    .dato { padding: 18px 20px; }
    .accion { padding: 32px 20px 16px; }
    .boton { width: 100%; }
    footer { padding: 0 16px 32px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .hero > *, .emblema::before, .emblema .logo { opacity: 1 !important; }
    }
</style>
</head>
<body>
  <header class="barra">
    <span class="izq">Valparaíso, Chile</span>
    <span class="marca">Gala USM</span>
    <span class="der">2027</span>
  </header>

  <main>
    <div class="caja">
      <section class="hero">
        <div class="emblema" aria-hidden="true">
          <img class="logo" src="logo-usm.png" alt="">
        </div>

        <p class="institucion">Universidad Técnica Federico Santa María</p>
        <h1>Gala USM</h1>
        <p class="bajada">Una noche de etiqueta frente al Pacífico.</p>
      </section>

      <dl class="datos">
        <div class="dato">
          <dt>Fecha</dt>
          <dd>2027</dd>
        </div>
        <div class="dato">
          <dt>Lugar</dt>
          <dd>Por definir</dd>
        </div>
        <div class="dato">
          <dt>Dress code</dt>
          <dd>Etiqueta rigurosa</dd>
        </div>
      </dl>

      <div class="accion">
        <!-- En el futuro este botón abrirá el formulario del sondeo -->
        <button class="boton" id="cta" type="button">Quiero asistir</button>
        <p class="nota" id="nota" aria-live="polite"></p>
      </div>
    </div>
  </main>

  <footer>Cupos limitados</footer>

<script>
  // Por ahora el botón solo avisa; luego abrirá el formulario
  document.getElementById('cta').addEventListener('click', function () {
    const nota = document.getElementById('nota');
    nota.textContent = 'El formulario se abrirá aquí muy pronto.';
    nota.classList.add('activa');
  });
</script>
</body>
</html>
