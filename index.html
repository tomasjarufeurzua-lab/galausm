<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gala USM 2027</title>
<meta name="description" content="Gala USM 2027. Una noche de etiqueta frente al Pacífico, en la Casa Central de Valparaíso.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Geist:wght@300;400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --negro: #000000;
    --linea: #1F1F1F;
    --blanco: #EDEDED;
    --gris: #8F8F8F;
    --gris-osc: #5C5C5C;
    --oro: #C9A45C;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Todo cabe en una pantalla: el alto disponible manda */
  html, body { height: 100%; }

  body {
    min-height: 100svh;
    height: 100svh;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(ellipse 70% 55% at 50% 32%, rgba(201,164,92,0.10), transparent 70%),
      radial-gradient(ellipse 90% 60% at 50% 110%, rgba(120,130,160,0.08), transparent 70%),
      var(--negro);
    color: var(--blanco);
    font-family: "Geist", system-ui, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- Barra superior ---------- */
  .barra {
    flex: none;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    height: clamp(44px, 7svh, 72px);
    padding: 0 clamp(16px, 3vw, 40px);
    border-bottom: 1px solid var(--linea);
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: clamp(0.6875rem, 1.4svh, 0.8125rem);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gris);
  }
  .barra .marca {
    font-family: "Bodoni Moda", Didot, serif;
    text-transform: none;
    letter-spacing: 0;
    font-size: clamp(1rem, 2.2svh, 1.25rem);
    color: var(--blanco);
  }
  .barra .der { text-align: right; }

  /* ---------- Contenedor con líneas finas ---------- */
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    justify-content: center;
    position: relative;
    padding: clamp(12px, 4svh, 56px) clamp(12px, 3vw, 40px) clamp(30px, 5svh, 56px);
  }

  /* Firma sutil bajo la caja */
  .firma {
    position: absolute;
    left: 0; right: 0;
    bottom: clamp(8px, 1.6svh, 18px);
    text-align: center;
    font-family: "Bodoni Moda", Didot, serif;
    font-style: italic;
    font-size: clamp(0.75rem, 1.4svh, 0.875rem);
    letter-spacing: 0.02em;
    color: var(--gris-osc);
  }

  .caja {
    width: 100%;
    max-width: 1120px;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--linea);
  }

  /* ---------- Hero ---------- */
  .hero {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(12px, 3svh, 48px) 16px;
    overflow: hidden;
    isolation: isolate;
  }

  /* Emblema: escudo con brillo, al estilo de los logos de Apple Events */
  .emblema {
    position: relative;
    width: min(240px, 26svh, 62vw);
  }
  .emblema::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 280%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    z-index: -1;
    background: radial-gradient(circle, rgba(240,221,168,0.20), rgba(201,164,92,0.08) 40%, transparent 68%);
    opacity: 0;
    animation: aparecer 2.4s ease 0.8s forwards;
  }
  .emblema .logo {
    display: block;
    width: 100%;
    height: auto;
    opacity: 0;
    animation: aparecer 1.4s ease 0.3s forwards;
  }

  .institucion {
    margin-top: clamp(14px, 4svh, 48px);
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: clamp(0.625rem, 1.3svh, 0.75rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gris);
  }

  h1 {
    margin-top: clamp(6px, 1.6svh, 20px);
    font-family: "Bodoni Moda", Didot, serif;
    font-weight: 400;
    font-size: min(11vw, 12svh, 8.5rem);
    line-height: 0.95;
    letter-spacing: -0.025em;
    color: #FFFFFF;
    white-space: nowrap;
  }

  .bajada {
    margin-top: clamp(8px, 2svh, 24px);
    max-width: 36ch;
    font-family: "Bodoni Moda", Didot, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1.0625rem, 2.6svh, 1.625rem);
    line-height: 1.35;
    letter-spacing: 0.005em;
    color: #CFC8B8;
  }

  .hero > *:not(.emblema) {
    opacity: 0;
    animation: aparecer 1s ease forwards;
  }
  .hero .institucion { animation-delay: 1.2s; }
  .hero h1 { animation-delay: 1.35s; }
  .hero .bajada { animation-delay: 1.5s; }

  /* ---------- Datos ---------- */
  .datos {
    flex: none;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--linea);
  }
  .dato {
    padding: clamp(10px, 2.4svh, 24px) clamp(12px, 2.4vw, 28px);
    text-align: left;
  }
  .dato + .dato { border-left: 1px solid var(--linea); }
  .dato dt {
    font-family: "Geist", system-ui, sans-serif;
    font-weight: 300;
    font-size: clamp(0.625rem, 1.2svh, 0.6875rem);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--oro);
    opacity: 0.85;
  }
  .dato dd {
    margin-top: clamp(4px, 1svh, 10px);
    font-family: "Bodoni Moda", Didot, serif;
    font-weight: 400;
    font-size: clamp(1rem, 2.6svh, 1.5rem);
    line-height: 1.2;
    color: #FFFFFF;
  }

  /* ---------- Acción ---------- */
  .accion {
    flex: none;
    position: relative;
    border-top: 1px solid var(--linea);
    padding: clamp(14px, 3.6svh, 44px) 16px clamp(22px, 4.4svh, 52px);
    text-align: center;
  }

  .boton {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 248px;
    height: clamp(44px, 6svh, 52px);
    padding: 0 36px;
    border: 1px solid #FFFFFF;
    border-radius: 999px;
    background: #FFFFFF;
    color: #000000;
    font-family: "Geist", system-ui, sans-serif;
    font-size: 0.9375rem;
    font-weight: 500;
    cursor: pointer;
    transition: box-shadow .3s ease, border-color .3s ease;
  }
  .boton:hover {
    border-color: var(--oro);
    box-shadow: 0 0 0 4px rgba(201,164,92,0.18), 0 0 40px -6px rgba(201,164,92,0.45);
  }
  .boton:focus-visible {
    outline: 2px solid var(--oro);
    outline-offset: 4px;
  }

  /* El aviso aparece bajo el botón sin empujar nada */
  .nota {
    position: absolute;
    left: 0; right: 0;
    bottom: clamp(4px, 1.2svh, 16px);
    font-size: 0.75rem;
    color: var(--blanco);
  }

  @keyframes aparecer { to { opacity: 1; } }

  /* ---------- Móvil ---------- */
  @media (max-width: 720px) {
    .barra { grid-template-columns: 1fr auto; }
    .barra .izq { display: none; }
    .dato { padding-left: 10px; padding-right: 10px; }
    .boton { width: 100%; min-width: 0; }
  }

  /* Pantallas muy bajas (celular horizontal): se queda lo esencial */
  @media (max-height: 500px) {
    .institucion, .bajada { display: none; }
    .emblema { width: min(240px, 22svh, 62vw); }
    h1 { margin-top: 8px; font-size: min(11vw, 13svh, 8.5rem); }
    .hero { padding: 8px 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .hero > *, .emblema::before, .emblema .logo { opacity: 1 !important; }
  }
</style>
</head>
<body>
  <header class="barra">
    <span class="izq">Valparaíso, Chile</span>
    <span class="marca">Gala USM</span>
    <span class="der">2027</span>
  </header>

  <main>
    <div class="caja">
      <section class="hero">
        <div class="emblema" aria-hidden="true">
          <img class="logo" src="logo-usm-color.png" alt="">
        </div>

        <p class="institucion">Universidad Técnica Federico Santa María</p>
        <h1>Gala USM</h1>
        <p class="bajada">Una noche de etiqueta frente al Pacífico.</p>
      </section>

      <dl class="datos">
        <div class="dato">
          <dt>Fecha</dt>
          <dd>2027</dd>
        </div>
        <div class="dato">
          <dt>Lugar</dt>
          <dd>Por definir</dd>
        </div>
        <div class="dato">
          <dt>Dress code</dt>
          <dd>Etiqueta rigurosa</dd>
        </div>
      </dl>

      <div class="accion">
        <!-- En el futuro este botón abrirá el formulario del sondeo -->
        <button class="boton" id="cta" type="button">Quiero asistir</button>
        <p class="nota" id="nota" aria-live="polite"></p>
      </div>
    </div>
    <p class="firma">By Max Godoy y Tomas Jarufe</p>
  </main>

<script>
  // Por ahora el botón solo avisa; luego abrirá el formulario
  document.getElementById('cta').addEventListener('click', function () {
    const nota = document.getElementById('nota');
    nota.textContent = 'El formulario se abrirá aquí muy pronto.';
      });
</script>
</body>
</html>
